<script>
(()=>{'use strict';
const STORE_KEY='nexo-pro-gestao-v2';
const LEGACY_STORE_KEY='nexo-pro-gestao-v1';

const CATS=['Transporte','Marketing','Ferramentas','Equipamentos','Taxas','Energia/Internet','Outros'];
const NAV=[['dashboard','Visão geral','dashboard'],['sales','Vendas','shopping-bag'],['stock','Estoque','layers'],['cash','Caixa e capital','wallet'],['expenses','Despesas','wallet'],['reports','Relatórios','bar-chart'],['clients','Clientes','users'],['settings','Configurações','settings']];
const icons={dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>','shopping-bag':'<path d="M6 7V5a6 6 0 0 1 12 0v2"/><path d="M4 7h16l1 14H3L4 7Z"/>',layers:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M4 10h16"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 11h5v5h-5a2 2 0 0 1 0-5"/>','bar-chart':'<path d="M4 21V4M4 21h17M9 17v-5m5 5V7m5 10V4"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 5a4 4 0 0 1 0 7M17 15a6 6 0 0 1 5 6"/>',settings:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>',alert:'<path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 18h.01"/>',box:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 7v10l9 5 9-5V7M12 12v10"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',chevron:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m4 12 5 5 11-11"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7m4-7v7"/>',edit:'<path d="m4 20 4-.5L20 7.5 16.5 4 4.5 16l-.5 4Z"/>'};
const ico=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.box}</svg>`;
const fresh=()=>({version:2,purchases:[],sales:[],payments:[],expenses:[],movements:[],settings:{salePrice:80,lowStock:5,targetStock:20,recipe:{acrilico:1,adesivo:1,nfc:1,embalagem:0}}});
let state;let view='dashboard';let filter='all';let toastTimer=0;
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const num=v=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(Number(v)||0);
const round=v=>Math.round((Number(v)+Number.EPSILON)*100)/100;
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const monthNow=()=>today().slice(0,7);
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`n${Date.now()}${Math.random().toString(36).slice(2)}`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?`${String(v).slice(8,10)}/${String(v).slice(5,7)}/${String(v).slice(0,4)}`:'—';
const inPeriod=(date,per=filter)=>per==='all'||String(date).slice(0,7)===per;
const sum=(arr,cb)=>arr.reduce((acc,x)=>acc+(cb?cb(x):x),0);
const qtyString=q=>Number(q).toLocaleString('pt-BR',{maximumFractionDigits:2});
function upgradeData(value){
 if(!value||![1,2].includes(value.version))throw Error('Arquivo não é um backup da NEXO compatível.');
 const data=JSON.parse(JSON.stringify(value));
 if(!Array.isArray(data.movements))data.movements=[];
 if(!data.settings||typeof data.settings!=='object')throw Error('Configurações ausentes.');
 if(data.settings.targetStock===undefined)data.settings.targetStock=20;
 if(Array.isArray(data.sales))for(const x of data.sales){if(!x.model)x.model='Não informado';if(!x.stage)x.stage='novo';}
 data.version=2;
 return data;
}
function load(){try{
 const raw=localStorage.getItem(STORE_KEY)||localStorage.getItem(LEGACY_STORE_KEY);
 if(!raw)return fresh();
 const obj=upgradeData(JSON.parse(raw));
 validateData(obj);
 return obj;
 }catch(e){console.warn('Não foi possível carregar registros:',e);
 // Na presença de arquivo ilegível, não sobregravar silenciosamente os dados armazenados.
 window.__nexoLoadProblem=e.message||'Dados locais inválidos';
 return fresh();
 }}

function isValidShape(o){return !!o&&typeof o==='object'&&o.version===2&&Array.isArray(o.purchases)&&Array.isArray(o.sales)&&Array.isArray(o.payments)&&Array.isArray(o.expenses)&&Array.isArray(o.movements)&&o.settings&&typeof o.settings==='object'&&o.settings.recipe&&typeof o.settings.recipe==='object'}

function persist(next){if(window.__nexoLoadProblem){notify('Há um problema no arquivo local. Importe um backup ou use Zerar dados antes de continuar.',true);return false;}const raw=JSON.stringify(next);try{localStorage.setItem(STORE_KEY,raw);state=next;return true}catch(err){notify('Falha ao salvar neste navegador. Verifique o espaço disponível.',true);return false}}

function notify(message,error=false){const el=document.getElementById('toastMount');el.innerHTML=`<div class="toast ${error?'error':''}">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',4400)}
function clone(){return JSON.parse(JSON.stringify(state))}
function recipeOf(s){return s.settings.recipe||{acrilico:1,adesivo:1,nfc:1,embalagem:0}}
function validDate(v){if(typeof v!=='string'||!/^(\d{4})-(\d\d)-(\d\d)$/.test(v))return false;const d=new Date(v+'T12:00:00');return !Number.isNaN(d.getTime())&&d.getFullYear()===Number(v.slice(0,4))&&d.getMonth()+1===Number(v.slice(5,7))&&d.getDate()===Number(v.slice(8));}
function validateData(s){if(!isValidShape(s))throw Error('Formato de arquivo incompatível.');
 for(const p of s.purchases){if(!p.id||!validDate(p.date)||!MATERIALS.some(x=>x.id===p.material)||!(Number.isInteger(p.qty)&&p.qty>0)||!Number.isFinite(p.unitCost)||p.unitCost<0)throw Error('Há uma compra de material inválida.');}
 for(const v of s.sales){if(!v.id||!validDate(v.date)||!v.client||!Number.isInteger(v.qty)||v.qty<1||!Number.isFinite(v.unitPrice)||v.unitPrice<=0||!Number.isFinite(v.discount)||v.discount<0||!Number.isFinite(v.extraCost)||v.extraCost<0||v.qty*v.unitPrice-v.discount<=0||!MODELS.includes(v.model)||!STAGES.some(t=>t[0]===v.stage)||v.dueDate&&!validDate(v.dueDate))throw Error('Há uma venda inválida.');}
 for(const p of s.payments){if(!p.id||!validDate(p.date)||!s.sales.some(v=>v.id===p.saleId)||!Number.isFinite(p.amount)||p.amount<=0)throw Error('Há um recebimento inválido.');}
 for(const x of s.expenses){if(!x.id||!validDate(x.date)||!Number.isFinite(x.amount)||x.amount<=0||!x.description)throw Error('Há uma despesa inválida.');}
 for(const x of s.movements){if(!x.id||!validDate(x.date)||!['aporte','retirada'].includes(x.type)||!Number.isFinite(x.amount)||x.amount<=0)throw Error('Há uma movimentação de capital inválida.');}
 for(const m of MATERIALS){const n=Number(recipeOf(s)[m.id]);if(!Number.isInteger(n)||n<0||n>20)throw Error('A composição da plaquinha está inválida.');}
 if(!Number.isFinite(s.settings.salePrice)||s.settings.salePrice<=0||!Number.isInteger(s.settings.lowStock)||s.settings.lowStock<0||!Number.isInteger(s.settings.targetStock)||s.settings.targetStock<1||s.settings.targetStock>10000)throw Error('Parâmetros do painel inválidos.');
 for(const sale of s.sales){if(sale.recipeSnapshot){for(const m of MATERIALS){const n=Number(sale.recipeSnapshot[m.id]);if(!Number.isInteger(n)||n<0||n>20)throw Error('A composição histórica de uma venda é inválida.');}}
 const due=sum(s.payments.filter(p=>p.saleId===sale.id),p=>p.amount);
 if(due>saleTotal(sale)+.009)throw Error(`Os recebimentos da venda de ${sale.client||'cliente'} excedem o total.`);
 if(sale.cancelled&&due>.009)throw Error('Uma venda cancelada não pode ter recebimentos registrados.');
 }
 const allIds=[...s.purchases,...s.sales,...s.payments,...s.expenses,...s.movements].map(x=>x.id);
 if(allIds.length!==new Set(allIds).size)throw Error('IDs duplicados no arquivo.');
 calc(s,true);return true;
}


const saleTotal=s=>round(s.qty*s.unitPrice-s.discount);
// Materiais comprados são ativos de estoque. Somente o consumo na venda vira custo do produto.
function calc(s,strict=false){const inv=Object.fromEntries(MATERIALS.map(m=>[m.id,{qty:0,value:0}]));const saleCosts={};const events=[...s.purchases.map(x=>({...x,kind:'purchase'})),...s.sales.filter(v=>!v.cancelled).map(x=>({...x,kind:'sale'}))].sort((a,b)=>a.date.localeCompare(b.date)||(a.kind==='purchase'?-1:1)-(b.kind==='purchase'?-1:1)||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
let warning='';for(const e of events){if(e.kind==='purchase'){inv[e.material].qty+=e.qty;inv[e.material].value+=e.qty*e.unitCost;continue;}let cost=0;for(const m of MATERIALS){const used=(e.recipeSnapshot||recipeOf(s))[m.id]*e.qty;if(!used)continue;const item=inv[m.id];if(item.qty+1e-6<used){warning=`Estoque insuficiente de ${m.name} em ${fmtDate(e.date)} para esta venda. Cadastre a compra antes da venda ou ajuste a composição.`;if(strict)throw Error(warning);continue;}const unit=item.qty>0?item.value/item.qty:0;cost+=unit*used;item.value-=unit*used;item.qty-=used;if(item.qty<1e-9){item.qty=0;item.value=0;}}saleCosts[e.id]=round(cost);}
return {inv,saleCosts,warning};}
function paymentSum(saleId,s=state){return round(sum(s.payments.filter(x=>x.saleId===saleId),x=>x.amount))}
function detailSales(s=state){const c=calc(s);return s.sales.filter(x=>!x.cancelled).map(x=>({...x,revenue:saleTotal(x),received:paymentSum(x.id,s),pending:round(saleTotal(x)-paymentSum(x.id,s)),materialsCost:c.saleCosts[x.id]||0,profit:round(saleTotal(x)-(c.saleCosts[x.id]||0)-x.extraCost)}))}
function capitalTotals(per='all',s=state){const list=s.movements.filter(x=>inPeriod(x.date,per));return {aportes:round(sum(list.filter(x=>x.type==='aporte'),x=>x.amount)),retiradas:round(sum(list.filter(x=>x.type==='retirada'),x=>x.amount))};}
function cashLedger(per=filter,s=state){const ledger=[];
 for(const x of s.purchases.filter(x=>inPeriod(x.date,per)))ledger.push({id:x.id,date:x.date,type:'Compra de material',description:MATERIALS.find(m=>m.id===x.material)?.name||'Material',amount:-round(x.qty*x.unitCost)});
 for(const x of s.payments.filter(x=>inPeriod(x.date,per)))ledger.push({id:x.id,date:x.date,type:'Recebimento',description:s.sales.find(y=>y.id===x.saleId)?.client||'Cliente',amount:x.amount});
 for(const x of s.expenses.filter(x=>inPeriod(x.date,per)))ledger.push({id:x.id,date:x.date,type:'Despesa',description:x.description,amount:-x.amount});
 for(const x of s.sales.filter(x=>!x.cancelled&&inPeriod(x.date,per)&&x.extraCost>0))ledger.push({id:x.id,date:x.date,type:'Custo extra',description:x.client,amount:-x.extraCost});
 for(const x of s.movements.filter(x=>inPeriod(x.date,per)))ledger.push({id:x.id,date:x.date,type:x.type==='aporte'?'Aporte do proprietário':'Retirada do proprietário',description:x.note||'Movimentação do proprietário',amount:x.type==='aporte'?x.amount:-x.amount,manual:true});
 return ledger.sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
}
function periodStats(per=filter,s=state){const sales=detailSales(s).filter(x=>inPeriod(x.date,per));const purchases=s.purchases.filter(x=>inPeriod(x.date,per));const expenses=s.expenses.filter(x=>inPeriod(x.date,per));const payments=s.payments.filter(x=>inPeriod(x.date,per));const direct=sum(sales,x=>x.extraCost),material=sum(sales,x=>x.materialsCost),ops=sum(expenses,x=>x.amount);const revenue=sum(sales,x=>x.revenue);const received=sum(payments,x=>x.amount);const purchasesCash=sum(purchases,x=>x.qty*x.unitCost);const out=purchasesCash+ops+direct;const capital=capitalTotals(per,s);const cash=round(received-out);return {sales,revenue,received,material,direct,ops,purchasesCash,expenses:out,profit:round(revenue-material-direct-ops),cash,balance:round(cash+capital.aportes-capital.retiradas),capital,units:sum(sales,x=>x.qty),margin:revenue?100*(revenue-material-direct-ops)/revenue:0,orders:sales.length,receivable:sum(detailSales(s),x=>x.pending)};}

const stageLabel=s=>STAGES.find(x=>x[0]===s)?.[1]||'Pedido confirmado';
function status(s){if(s.pending<.01)return ['Quitado','ok'];if(s.dueDate&&s.dueDate<today())return ['Em atraso','bad'];if(s.received>.001)return ['Parcial','blue'];return ['Pendente','warn'];}
function optVal(value,label,selected){return `<option value="${esc(value)}" ${String(selected)===String(value)?'selected':''}>${esc(label)}</option>`}
function renderPeriodOptions(){const periods=new Set([monthNow()]);for(const arr of [state.purchases,state.sales,state.payments,state.expenses,state.movements])for(const x of arr){if(x.date)periods.add(x.date.slice(0,7))}const options=[...periods].sort().reverse().map(v=>optVal(v,monthLabel(v),filter)).join('');document.getElementById('periodFilter').innerHTML=optVal('all','Todo o período',filter)+options;}
function monthLabel(m){const [y,n]=m.split('-').map(Number);return new Date(y,n-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function choosePage(v){view=v;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===v));document.getElementById('mobileMore')?.classList.remove('open');document.querySelectorAll('[data-action=more]').forEach(b=>b.classList.toggle('active',['reports','clients','cash','settings'].includes(v)));const names={dashboard:['INTELIGÊNCIA DO NEGÓCIO','Visão geral','Indicadores confiáveis para acompanhar cada plaquinha.'],sales:['COMERCIAL','Controle de vendas','Registre pedidos, pagamentos e valores em aberto.'],stock:['PRODUÇÃO','Estoque e materiais','Controle suas compras, unidades disponíveis e custo médio.'],cash:['MOVIMENTAÇÃO FINANCEIRA','Caixa e capital','Saiba o que entrou, o que saiu e quanto você aportou.'],expenses:['FINANCEIRO','Despesas operacionais','Despesas separadas do investimento em materiais.'],reports:['ANÁLISE FINANCEIRA','Relatórios','Faturamento, margem, caixa e resultados por período.'],clients:['RELACIONAMENTO','Clientes','Histórico e concentração de vendas por cliente.'],settings:['SISTEMA','Configurações e dados','Personalize os cálculos e mantenha seus backups.']};const a=names[v];document.getElementById('pageLabel').textContent=a[0];document.getElementById('pageTitle').textContent=a[1];document.getElementById('pageSubtitle').textContent=a[2];const btn=document.getElementById('quickAction');const actions={dashboard:['Nova venda','sale'],sales:['Nova venda','sale'],stock:['Comprar material','purchase'],cash:['Novo aporte','movement'],expenses:['Nova despesa','expense'],reports:['Exportar CSV','csv'],clients:['Nova venda','sale'],settings:['Exportar backup','backup']};let [label,action]=actions[v];btn.innerHTML=`${ico(action==='backup'?'download':'plus')}${label}`;btn.dataset.action=action;render();window.scrollTo({top:0,behavior:'instant'});}
function navBuild(){const links=NAV.map(([id,label,icon])=>`<button type="button" data-page="${id}" class="${id===view?'active':''}">${ico(icon)}<span>${label}</span></button>`).join('');document.getElementById('sideNav').innerHTML=links;document.getElementById('mobileNav').innerHTML=NAV.filter(x=>['dashboard','sales','stock','expenses'].includes(x[0])).map(([id,label,icon])=>`<button type="button" data-page="${id}" class="${id===view?'active':''}">${ico(icon)}<span>${label==='Visão geral'?'Início':label}</span></button>`).join('')+`<button type="button" data-action="more">${ico('settings')}<span>Mais</span></button>`;document.getElementById('mobileMore').innerHTML=NAV.filter(x=>['reports','clients','cash','settings'].includes(x[0])).map(([id,label,icon])=>`<button type="button" data-page="${id}">${ico(icon)}<span>${label}</span></button>`).join('')}
function stat(label,val,hint,tone=''){return `<div class="stat ${tone}"><span class="lbl">${esc(label)}</span><strong class="value ${tone}">${esc(val)}</strong><span class="hint">${esc(hint)}</span></div>`}
function panel(title,sub,body,right=''){return `<section class="panel"><div class="panel-pad"><div class="panel-head"><div><h3 class="panel-title">${title}</h3>${sub?`<p class="panel-sub">${sub}</p>`:''}</div>${right}</div>${body}</div></section>`}
function empty(title,text,action='',label=''){return `<div class="empty">${ico('box')}<strong>${title}</strong>${text}${action?`<div style="margin-top:14px"><button class="btn primary sm" data-action="${action}">${ico('plus')}${label}</button></div>`:''}</div>`}
function table(header,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${header.map((x,i)=>`<th ${i===header.length-1?'class="right"':''}>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function miniSaleRows(sales,limit=6){return sales.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,limit).map(s=>{const [txt,cls]=status(s);return `<tr><td><b>${esc(s.client||'Cliente não informado')}</b><small>${fmtDate(s.date)} · ${s.qty} placa(s)</small></td><td>${money(s.revenue)}</td><td><span class="pill ${cls}">${txt}</span></td><td class="right"><button class="btn sm" data-action="sale-detail" data-id="${esc(s.id)}">Detalhes ${ico('chevron')}</button></td></tr>`})}
function alertItems(){const c=calc(state),recipe=recipeOf(state);const issues=[];if(state.purchases.length)for(const m of MATERIALS){if(recipe[m.id]>0&&c.inv[m.id].qty<=state.settings.lowStock)issues.push(`<div class="alert">${ico('alert')}<div><b>${m.name} com estoque baixo</b><br>${qtyString(c.inv[m.id].qty)} un. disponíveis; configure novas compras para não interromper a produção.</div></div>`)}const overdue=detailSales().filter(x=>x.pending>.009&&x.dueDate&&x.dueDate<today());if(overdue.length)issues.push(`<div class="alert">${ico('alert')}<div><b>${overdue.length} venda(s) com pagamento atrasado</b><br>${money(sum(overdue,x=>x.pending))} em aberto com prazo vencido.</div></div>`);return issues;}
function chart(){const months=[];const [y,n]=monthNow().split('-').map(Number);for(let i=5;i>=0;i--){const d=new Date(y,n-1-i,1);months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}const values=months.map(m=>periodStats(m));const max=Math.max(1,...values.map(v=>Math.max(v.revenue,Math.abs(v.profit))));return `<div class="bar-chart" role="img" aria-label="Comparação de receita e lucro nos últimos seis meses">${months.map((m,i)=>{const v=values[i];return `<div class="bar-group" title="${monthLabel(m)}: receita ${money(v.revenue)}, lucro ${money(v.profit)}"><div class="bar-space"><div class="bar" style="height:${Math.max(2,(v.revenue/max)*100)}%"></div><div class="bar profit ${v.profit<0?'loss':''}" style="height:${Math.max(2,(Math.abs(v.profit)/max)*100)}%"></div></div><span>${m.slice(5)}/${m.slice(2,4)}</span></div>`}).join('')}</div><div class="legend"><span><i class="dot"></i>Faturamento</span><span><i class="dot green"></i>Lucro / prejuízo</span></div>`}
function dashboard(){const s=periodStats();const kit=kitPossible();const alerts=alertItems();return `<div class="stats">${stat('Faturamento',money(s.revenue),'Vendas realizadas no período')}${stat('Lucro operacional',money(s.profit),'Após materiais consumidos, custos diretos e despesas',s.profit>=0?'green':'red')}${stat('Recebido de clientes',money(s.received),'Entradas efetivas de dinheiro','gold')}${stat('Investimento em materiais',money(s.purchasesCash),'Compras registradas no período')}${stat('Caixa operacional',money(s.cash),'Entradas e saídas da operação, sem aportes',s.cash>=0?'green':'red')}${stat('A receber',money(s.receivable),'Total de todas as vendas, independentemente do filtro','gold')}</div><div class="grid2"><section class="panel"><div class="panel-pad"><div class="panel-head"><div><h3 class="panel-title">Evolução financeira</h3><p class="panel-sub">Comparativo mensal dos últimos seis meses</p></div></div>${chart()}</div></section>${panel('Operação em tempo real','Estoque, margem e situação da produção',`<div class="kpi-row"><div class="tag"><label>Prontas para produzir</label><strong>${Number.isFinite(kit)?num(kit):'—'} un.</strong></div><div class="tag"><label>Unidades vendidas ${filter==='all'?'no total':'no período'}</label><strong>${num(s.units)} un.</strong></div><div class="tag"><label>Margem operacional</label><strong class="${s.margin<0?'text-red':''}">${s.revenue?num(s.margin)+'%':'—'}</strong></div><div class="tag"><label>Pedidos a entregar</label><strong>${detailSales().filter(x=>x.stage!=='entregue').length}</strong></div></div><hr class="separator"><div class="alerts">${alerts.length?alerts.slice(0,3).join(''):`<div class="helper-card">${ico('check')} Sem pendências críticas de estoque ou cobranças vencidas detectadas.</div>`}</div>`)}</div><div class="section-top"><div><h3>Últimas vendas</h3><p>Detalhes e recebimentos de cada pedido</p></div><button class="link" data-page="sales">Ver todas ${ico('arrow')}</button></div><section class="panel">${s.sales.length?table(['Cliente','Valor','Situação','Ações'],miniSaleRows(s.sales)):empty('Nenhuma venda no período','Cadastre a compra dos materiais e depois registre sua primeira venda.','purchase','Cadastrar materiais')}</section><div class="helper-card" style="margin-top:17px"><b>Entenda os indicadores:</b> comprar acrílicos, adesivos e NFCs movimenta o caixa e aumenta o estoque; o material só é reconhecido como custo quando uma plaquinha é vendida. Venda pendente gera faturamento e valor a receber, mas não aumenta o caixa até o pagamento.</div>`}
function kitPossible(){const r=recipeOf(state),i=calc(state).inv;const vals=MATERIALS.filter(m=>r[m.id]>0).map(m=>Math.floor(i[m.id].qty/r[m.id]));return vals.length?Math.min(...vals):Infinity;}
function salesPage(){const all=detailSales().filter(v=>inPeriod(v.date)).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt)));const stats=periodStats();return `<div class="kpi-row"><div class="tag"><label>Vendas confirmadas</label><strong>${stats.orders}</strong></div><div class="tag"><label>Receita das vendas</label><strong>${money(stats.revenue)}</strong></div><div class="tag"><label>Lucro dos pedidos (antes das despesas fixas)</label><strong>${money(sum(all,x=>x.profit))}</strong></div></div><div class="section-top"><div><h3>Pedidos registrados</h3><p>O estoque é descontado automaticamente a cada venda.</p></div><button class="btn sm" data-action="sale">${ico('plus')}Adicionar</button></div><section class="panel">${all.length?table(['Cliente / pedido','Valor','Materiais','Lucro pedido','Recebido / pendente','Status','Ações'],all.map(x=>{const [name,cl]=status(x);return `<tr><td><strong>${esc(x.client)}</strong><small>${fmtDate(x.date)} · ${esc(x.model)} · ${x.qty} un.${x.dueDate?' · venc. '+fmtDate(x.dueDate):''}</small></td><td>${money(x.revenue)}</td><td>${money(x.materialsCost)}</td><td class="${x.profit<0?'text-red':'text-green'}">${money(x.profit)}</td><td>${money(x.received)}<small>Faltam ${money(x.pending)}</small></td><td><span class="pill ${cl}">${name}</span><small>${esc(stageLabel(x.stage))}</small></td><td class="right"><div class="actions"><button class="btn sm" data-action="sale-detail" data-id="${esc(x.id)}">Abrir</button>${x.pending>0.009?`<button class="btn sm primary" data-action="payment" data-id="${esc(x.id)}">Receber</button>`:''}</div></td></tr>`})):empty('Ainda não há vendas','Assim que você registrar suas vendas, o painel calcula o custo e a margem por pedido.','sale','Nova venda')}</section><p class="note" style="margin-top:14px">O lucro do pedido considera o custo médio dos materiais consumidos e os custos extras cadastrados. As despesas operacionais são descontadas no resultado geral.</p>`}
function stockPage(){const c=calc(state);const kit=kitPossible();const p=state.purchases.filter(x=>inPeriod(x.date)).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="material-grid">${MATERIALS.map(m=>{const s=c.inv[m.id],unit=s.qty?s.value/s.qty:0;return `<article class="material-card"><div class="material-name">${esc(m.name)}</div><div class="material-qty">${num(s.qty)} <small>unidades</small></div><div class="meta">Custo médio: ${money(unit)} / un.<br>Valor estocado: ${money(s.value)}</div><div class="bottom"><span class="smallmuted">Por plaquinha: ${recipeOf(state)[m.id]}</span><span class="pill ${s.qty<=state.settings.lowStock&&recipeOf(state)[m.id]?'warn':'ok'}">${s.qty<=state.settings.lowStock&&recipeOf(state)[m.id]?'Baixo':'Estoque'}</span></div></article>`}).join('')}</div><div class="kpi-row" style="margin-top:16px"><div class="tag"><label>Capacidade atual de montagem</label><strong>${Number.isFinite(kit)?num(kit):'—'} plaquinhas</strong></div><div class="tag"><label>Valor estimado do estoque</label><strong>${money(sum(Object.values(c.inv),x=>x.value))}</strong></div><div class="tag"><label>Total gasto em compras</label><strong>${money(sum(state.purchases,x=>x.qty*x.unitCost))}</strong></div></div><div class="report-grid" style="margin-top:17px"><div>${replenishment()}</div><div>${panel('Estoque estratégico','Indicadores de produção',`<div class="mini-list"><div class="mini-item"><span>Capacidade com os materiais atuais</span><strong>${Number.isFinite(kit)?num(kit)+' un.':'—'}</strong></div><div class="mini-item"><span>Estoque está imobilizado em</span><strong>${money(sum(Object.values(c.inv),x=>x.value))}</strong></div><div class="mini-item"><span>Próxima ação</span><strong>${Number.isFinite(kit)&&kit<state.settings.targetStock?'Planejar compras':'Manter acompanhamento'}</strong></div></div>`)}</div></div><div class="section-top"><div><h3>Histórico de compras</h3><p>Cadastre unidades e valor pago por lote para calcular o custo médio.</p></div><button class="btn sm" data-action="purchase">${ico('plus')}Comprar material</button></div><section class="panel">${p.length?table(['Material','Data','Quantidade','Preço unitário','Valor total','Ações'],p.map(x=>`<tr><td><b>${esc(MATERIALS.find(m=>m.id===x.material)?.name)}</b><small>${esc(x.note||'Compra de estoque')}</small></td><td>${fmtDate(x.date)}</td><td>${x.qty} un.</td><td>${money(x.unitCost)}</td><td>${money(x.qty*x.unitCost)}</td><td class="right"><div class="actions"><button class="btn sm" data-action="purchase-edit" data-id="${esc(x.id)}">Editar</button><button class="btn sm danger" data-action="purchase-delete" data-id="${esc(x.id)}">Excluir</button></div></td></tr>`)):empty('Nenhuma compra cadastrada','Comece informando os materiais que você já comprou.','purchase','Primeira compra')}</section><p class="note" style="margin-top:14px">O custo médio é ponderado por quantidade; a composição por plaquinha pode ser alterada em Configurações. O sistema rejeita mudanças que deixem estoque negativo nas vendas já registradas.</p>`}
function cashPage(){const s=periodStats(),all=periodStats('all'),movs=state.movements.filter(x=>inPeriod(x.date)).sort((a,b)=>b.date.localeCompare(a.date));const ledger=cashLedger();return `<div class="stats">${stat('Saldo de caixa estimado',money(all.balance),'Movimento acumulado incluindo aportes e retiradas',all.balance>=0?'green':'red')}${stat('Entradas de clientes',money(s.received),'Recebimentos no período')}${stat('Saídas da operação',money(s.expenses),'Materiais, despesas e custos extras')}${stat('Aportes',money(s.capital.aportes),'Dinheiro colocado pelo proprietário','gold')}${stat('Retiradas',money(s.capital.retiradas),'Valores retirados pelo proprietário')}${stat('Variação do caixa',money(s.balance),'Entradas menos saídas deste período',s.balance>=0?'green':'red')}</div><div class="message-bar" style="margin-top:16px">Saldo <b>estimado</b>: o sistema considera materiais e despesas pagos nas datas cadastradas e custos extras na data da venda. Sem conciliação bancária, não equivale ao saldo real da conta. Aportes e retiradas não entram no cálculo do lucro.</div><div class="section-top"><div><h3>Movimentações do proprietário</h3><p>Registre dinheiro colocado no negócio ou retirado para uso pessoal.</p></div><button class="btn sm" data-action="movement">${ico('plus')}Novo movimento</button></div><section class="panel">${movs.length?table(['Data','Tipo','Descrição','Valor','Ações'],movs.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><span class="pill ${x.type==='aporte'?'ok':'warn'}">${x.type==='aporte'?'Aporte':'Retirada'}</span></td><td>${esc(x.note||'—')}</td><td class="${x.type==='aporte'?'text-green':'text-red'}">${x.type==='aporte'?'+':'−'} ${money(x.amount)}</td><td class="right"><div class="actions"><button class="btn sm" data-action="movement-edit" data-id="${esc(x.id)}">Editar</button><button class="btn sm danger" data-action="movement-delete" data-id="${esc(x.id)}">Excluir</button></div></td></tr>`)):empty('Nenhuma movimentação de capital','Cadastre o capital inicial investido e futuras retiradas.','movement','Registrar aporte')}</section><div class="section-top"><div><h3>Extrato gerencial</h3><p>Todas as entradas e saídas registradas no período.</p></div></div><section class="panel">${ledger.length?table(['Data','Natureza','Referência','Entrada / saída'],ledger.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td class="right ${x.amount>=0?'text-green':'text-red'}">${x.amount>=0?'+':''}${money(x.amount)}</td></tr>`)):empty('Nenhum movimento no período','Compras, recebimentos e despesas aparecerão aqui automaticamente.')}</section>`}
function replenishment(){const c=calc(state),r=recipeOf(state),target=state.settings.targetStock;let known=true,total=0;const rows=[];for(const m of MATERIALS){if(!r[m.id])continue;const current=c.inv[m.id].qty,need=Math.max(0,target*r[m.id]-current);const older=state.purchases.filter(p=>p.material===m.id).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt)))[0];const unit=current>0?c.inv[m.id].value/current:older?.unitCost;if(need>0&&unit===undefined)known=false;total+=need*(unit||0);rows.push(`<div class="mini-item"><span>${esc(m.name)} <small class="muted">(${num(current)} em estoque)</small></span><strong>${need>0?`Comprar ${num(need)} un.`:'Suficiente'}</strong></div>`)}return panel('Planejamento de reposição',`Materiais para ter capacidade de produzir ${target} plaquinhas`,`${rows.length?`<div class="mini-list">${rows.join('')}</div><div class="mini-item"><span>Investimento estimado para repor</span><strong class="text-gold">${known?money(total):'Preço de material não cadastrado'}</strong></div>`:'<p class="smallmuted">Defina os materiais usados em Configurações.</p>'}<p class="note">Estimativa usando custo médio atual ou última compra, sem cotação real de fornecedor. O alvo pode ser alterado em Configurações.</p>`)}
function expensesPage(){const rows=state.expenses.filter(x=>inPeriod(x.date)).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="stats">${stat('Despesas do período',money(sum(rows,x=>x.amount)),'Não inclui compra de materiais','red')}${stat('Lançamentos',String(rows.length),'Despesas operacionais registradas')}${stat('Gasto médio',money(rows.length?sum(rows,x=>x.amount)/rows.length:0),'Por lançamento')}</div><div class="section-top"><div><h3>Despesas operacionais</h3><p>Ex.: marketing, ferramentas, transporte e taxas.</p></div><button class="btn sm" data-action="expense">${ico('plus')}Nova despesa</button></div><section class="panel">${rows.length?table(['Descrição','Categoria','Data','Valor','Ações'],rows.map(x=>`<tr><td><b>${esc(x.description)}</b></td><td>${esc(x.category)}</td><td>${fmtDate(x.date)}</td><td>${money(x.amount)}</td><td class="right"><div class="actions"><button class="btn sm" data-action="expense-edit" data-id="${esc(x.id)}">Editar</button><button class="btn sm danger" data-action="expense-delete" data-id="${esc(x.id)}">Excluir</button></div></td></tr>`)):empty('Nenhuma despesa no período','Adicione despesas que não representam compra de estoque.','expense','Registrar despesa')}</section>`}
function reportsPage(){const s=periodStats();const selected=detailSales().filter(x=>inPeriod(x.date));const c=calc(state);const gross=s.revenue-s.material-s.direct;const rec=s.revenue?gross/s.revenue*100:0;const totalStock=sum(Object.values(c.inv),x=>x.value);const liveUnit=unitCost();return `<div class="stats">${stat('Faturamento',money(s.revenue),'Vendas no período')}${stat('Custos dos produtos vendidos',money(s.material),'Acrílico, adesivo, tags e embalagens')}${stat('Despesas e custos extras',money(s.ops+s.direct),'Operação + custos diretos de pedidos')}${stat('Lucro operacional',money(s.profit),'Receita menos custos e despesas',s.profit>=0?'green':'red')}${stat('Fluxo líquido de caixa',money(s.cash),'Recebimentos − compras − despesas',s.cash>=0?'green':'red')}${stat('Contas a receber',money(s.receivable),'Todas as vendas ainda não quitadas','gold')}</div><div class="report-grid" style="margin-top:17px">${panel('Demonstrativo de resultado','Regime de competência: considera a data da venda',`<div class="mini-list">${[['Receita de vendas',money(s.revenue)],['(−) Materiais consumidos',money(s.material)],['(−) Custos extras de pedidos',money(s.direct)],['= Lucro bruto',money(gross)],['(−) Despesas operacionais',money(s.ops)],['= Resultado operacional',money(s.profit)]].map(([a,b],i)=>`<div class="mini-item"><span class="${i===5?'text-gold':''}">${a}</span><strong class="${i===5?'text-gold':''}">${b}</strong></div>`).join('')}</div><p class="note">Não inclui impostos nem custos não informados. Não é um demonstrativo contábil oficial.</p>`)}${panel('Movimentação de caixa','Regime de caixa: usa datas dos pagamentos recebidos',`<div class="mini-list">${[['(+) Clientes pagaram',money(s.received)],['(−) Compras de materiais',money(s.purchasesCash)],['(−) Despesas operacionais',money(s.ops)],['(−) Custos extras de pedidos',money(s.direct)],['(+) Aportes',money(s.capital.aportes)],['(−) Retiradas',money(s.capital.retiradas)],['= Variação do caixa',money(s.balance)]].map(([a,b],i)=>`<div class="mini-item"><span class="${i===6?'text-gold':''}">${a}</span><strong class="${i===6?'text-gold':''}">${b}</strong></div>`).join('')}</div><p class="note">Variação de caixa não é saldo bancário: não inclui valores anteriores ao cadastro nem movimentações ausentes. Custos extras são assumidos pagos na data da venda.</p>`)}</div><div class="report-grid" style="margin-top:17px">${panel('Indicadores de desempenho','Qualidade financeira das vendas',`<div class="kpi-row"><div class="tag"><label>Margem bruta estimada</label><strong>${s.revenue?num(rec)+'%':'—'}</strong></div><div class="tag"><label>Margem operacional</label><strong>${s.revenue?num(s.margin)+'%':'—'}</strong></div><div class="tag"><label>Ticket médio</label><strong>${money(s.orders?s.revenue/s.orders:0)}</strong></div><div class="tag"><label>Custo médio unitário atual</label><strong>${liveUnit===null?'—':money(liveUnit)}</strong></div></div>`)}${panel('Situação do estoque','Bens ainda disponíveis para produção',`<div class="big-value text-gold">${money(totalStock)}</div><div class="smallmuted">Valor dos materiais ainda não consumidos, ao custo médio.</div><hr class="separator"><div class="kpi-row"><div class="tag"><label>Capacidade de montagem</label><strong>${Number.isFinite(kitPossible())?kitPossible():'—'} un.</strong></div><div class="tag"><label>Unidades vendidas</label><strong>${s.units}</strong></div></div>`)}</div><div style="margin-top:17px">${panel('Vendas por modelo','Compare Google, Instagram e personalizadas no período',`<div class="mini-list">${MODELS.map(model=>{const a=selected.filter(x=>x.model===model);return `<div class="mini-item"><span>${model} · ${sum(a,x=>x.qty)} placa(s)</span><strong>${money(sum(a,x=>x.revenue))}</strong></div>`}).join('')}</div>`)}</div><div class="section-top"><div><h3>Histórico mês a mês</h3><p>Os totais de caixa e lucro seguem critérios diferentes.</p></div><button class="btn sm" data-action="csv">${ico('download')}Exportar CSV</button></div><section class="panel">${table(['Mês','Vendas','Faturamento','Lucro operacional','Recebido','Caixa líquido'],reportMonths().map(m=>{const v=periodStats(m);return `<tr><td><b>${esc(monthLabel(m))}</b></td><td>${v.orders}</td><td>${money(v.revenue)}</td><td class="${v.profit<0?'text-red':'text-green'}">${money(v.profit)}</td><td>${money(v.received)}</td><td class="right ${v.cash<0?'text-red':''}">${money(v.cash)}</td></tr>`}))}</section>`}
function reportMonths(){const months=new Set([monthNow()]);for(const list of [state.sales,state.payments,state.purchases,state.expenses,state.movements])for(const v of list)months.add(v.date.slice(0,7));return [...months].sort().reverse()}
function clientsPage(){const rows=new Map();for(const s of detailSales()){const key=(s.client||'Sem identificação').trim().toLocaleLowerCase('pt-BR');const r=rows.get(key)||{name:s.client||'Sem identificação',count:0,units:0,revenue:0,pending:0,last:s.date};r.count++;r.units+=s.qty;r.revenue+=s.revenue;r.pending+=s.pending;r.last=r.last>s.date?r.last:s.date;rows.set(key,r)}const clients=[...rows.values()].sort((a,b)=>b.revenue-a.revenue);return `<div class="stats">${stat('Clientes únicos',String(clients.length),'Com pelo menos uma venda')}${stat('Clientes recorrentes',String(clients.filter(x=>x.count>1).length),'Compraram mais de uma vez')}${stat('Faturamento acumulado',money(sum(clients,x=>x.revenue)),'Total de pedidos confirmados')}</div><div class="section-top"><div><h3>Carteira de clientes</h3><p>Agrupada automaticamente a partir das vendas.</p></div></div><section class="panel">${clients.length?table(['Cliente','Pedidos','Plaquinhas','Faturamento','A receber','Última compra'],clients.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.count}</td><td>${x.units}</td><td>${money(x.revenue)}</td><td>${money(x.pending)}</td><td class="right">${fmtDate(x.last)}</td></tr>`)):empty('Ainda não há clientes','Os clientes aparecerão automaticamente depois de registrar vendas.','sale','Nova venda')}</section><p class="note" style="margin-top:14px">Nomes iguais, ignorando maiúsculas/minúsculas, são agrupados; CPF, telefone e outras informações pessoais não são exigidos.</p>`}
function unitCost(){const c=calc(state),r=recipeOf(state);if(MATERIALS.some(m=>r[m.id]>0&&!state.purchases.some(p=>p.material===m.id)))return null;return sum(MATERIALS,m=>{if(!r[m.id])return 0;const inv=c.inv[m.id];if(inv.qty>0)return r[m.id]*inv.value/inv.qty;const latest=state.purchases.filter(p=>p.material===m.id).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt)))[0];return r[m.id]*(latest?.unitCost||0)})}
function settingsPage(){const r=recipeOf(state);return `<div class="report-grid"><section class="panel"><div class="panel-pad"><div class="panel-head"><div><h3 class="panel-title">Composição da plaquinha</h3><p class="panel-sub">Defina quanto cada venda de uma unidade consome do estoque.</p></div></div><form id="settingsForm" class="fields">${MATERIALS.map(m=>`<div class="field"><label for="r_${m.id}">${esc(m.name)} por unidade</label><input type="number" id="r_${m.id}" name="${m.id}" min="0" max="20" step="1" required value="${r[m.id]}"></div>`).join('')}<div class="field"><label>Preço de venda sugerido (R$)</label><input name="salePrice" inputmode="decimal" type="number" min="0.01" step="0.01" required value="${state.settings.salePrice}"></div><div class="field"><label>Meta de capacidade (plaquinhas)</label><input name="targetStock" type="number" min="1" max="10000" step="1" required value="${state.settings.targetStock}"></div><div class="field"><label>Aviso estoque baixo (un.)</label><input name="lowStock" type="number" min="0" max="100000" step="1" required value="${state.settings.lowStock}"></div><div class="field full"><button class="btn primary fullwidth" type="submit">${ico('check')}Salvar parâmetros</button></div></form><div class="form-help">A nova composição vale para vendas futuras. Vendas anteriores preservam a composição usada na data de registro, para não alterar seu custo histórico. O sistema impede estoque negativo.</div></div></section>${panel('Simulador de preço','Simule o lucro bruto com base no custo médio do estoque atual',`<div class="fields"><div class="field"><label for="simPrice">Preço de venda (R$)</label><input id="simPrice" type="number" step="0.01" min="0.01" value="${state.settings.salePrice}"></div><div class="field"><label for="simQty">Unidades vendidas</label><input id="simQty" type="number" step="1" min="1" value="10"></div><div class="field full"><label for="simExtra">Custos extras por unidade (R$)</label><input id="simExtra" type="number" min="0" step="0.01" value="0"></div></div><div id="simulation"></div><p class="note">É uma projeção, não uma venda registrada. Não desconta despesas fixas nem impostos. Quando faltar material cadastrado, o custo estimado pode ficar incompleto.</p>`)}</div><div class="section-top"><div><h3>Segurança e exportação</h3><p>Os dados são armazenados apenas no navegador deste aparelho.</p></div></div><section class="panel"><div class="panel-pad"><div class="row-flex"><button class="btn primary" data-action="backup">${ico('download')}Backup JSON</button><button class="btn" data-action="csv">${ico('download')}Relatório CSV</button><label class="btn" style="cursor:pointer">Importar backup JSON<input id="importFile" type="file" accept="application/json,.json" hidden></label><button class="btn danger" data-action="reset">${ico('trash')}Zerar dados</button></div><div class="form-help"><b>Importante:</b> exporte um backup JSON da versão anterior antes de trocar de arquivo. A v2 reconhece dados da v1 no mesmo navegador e também importa backups antigos. Sem conta e sem nuvem, limpar o navegador, mudar de aparelho ou usar modo privado pode apagar os registros. Exporte um backup JSON com frequência. O CSV serve para análise; somente o JSON restaura os dados. Ao importar, os registros atuais serão substituídos após confirmação.</div></div></section>`}
function simulate(){const el=document.getElementById('simulation');if(!el)return;const price=Number(document.getElementById('simPrice')?.value||0),qty=Number(document.getElementById('simQty')?.value||0),extra=Number(document.getElementById('simExtra')?.value||0),cost=unitCost();if(cost===null){el.innerHTML='<div class="form-help">Cadastre os preços dos materiais necessários em Estoque para que o simulador mostre um lucro confiável.</div>';return;}const margin=price?100*(price-cost-extra)/price:0;el.innerHTML=`<div class="kpi-row" style="margin-top:18px"><div class="tag"><label>Custo médio dos materiais/un.</label><strong>${money(cost)}</strong></div><div class="tag"><label>Lucro bruto estimado/un.</label><strong class="${price-cost-extra<0?'text-red':'text-green'}">${money(price-cost-extra)}</strong></div><div class="tag"><label>Lucro bruto total</label><strong class="${price-cost-extra<0?'text-red':'text-green'}">${money((price-cost-extra)*qty)}</strong></div><div class="tag"><label>Margem bruta</label><strong>${num(margin)}%</strong></div></div>`}
function render(){renderPeriodOptions();let html={dashboard,sales:salesPage,stock:stockPage,cash:cashPage,expenses:expensesPage,reports:reportsPage,clients:clientsPage,settings:settingsPage}[view]();document.getElementById('root').innerHTML=(window.__nexoLoadProblem?`<div class="message-bar"><b>Atenção:</b> os dados armazenados neste aparelho não foram carregados (${esc(window.__nexoLoadProblem)}). Para não sobrescrevê-los, novos lançamentos foram bloqueados. Importe um backup válido em Configurações ou zere os dados conscientemente.</div>`:'')+html;if(view==='settings')simulate();}
function field(label,name,type,value='',extras='',span=''){return `<div class="field ${span}"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extras}></div>`}
function sel(label,name,options,selected='',span=''){return `<div class="field ${span}"><label for="f_${name}">${esc(label)}</label><select id="f_${name}" name="${name}">${options.map(([v,l])=>optVal(v,l,selected)).join('')}</select></div>`}
function modal(title,formbody,ok='Salvar',submit='formSubmit',help=''){document.getElementById('modalMount').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><div role="dialog" aria-modal="true" aria-labelledby="dialogTitle" class="modal"><div class="modal-head"><h3 id="dialogTitle">${title}</h3><button type="button" class="icon-btn" data-action="close" aria-label="Fechar">${ico('close')}</button></div><form id="editForm" data-submit="${submit}"><div class="modal-body"><div id="formError"></div><div class="fields">${formbody}</div>${help?`<div class="form-help">${help}</div>`:''}</div><div class="modal-foot"><button type="button" class="btn" data-action="close">Cancelar</button><button type="submit" class="btn primary">${esc(ok)}</button></div></form></div></div>`;setTimeout(()=>document.querySelector('#editForm input:not([type=hidden]),#editForm select')?.focus(),0)}
function closeModal(){document.getElementById('modalMount').innerHTML=''}
function errForm(text){const el=document.getElementById('formError');if(el)el.innerHTML=`<div class="form-error">${esc(text)}</div>`;else notify(text,true)}
function openPurchase(item){const body=`${sel('Material','material',MATERIALS.map(x=>[x.id,x.name]),item?.material||'acrilico')}${field('Data da compra','date','date',item?.date||today(),'required')}${field('Quantidade comprada (un.)','qty','number',item?.qty||'', 'min="1" step="1" required')}${field('Preço unitário (R$)','unitCost','number',item?.unitCost??'', 'min="0" step="0.01" required')}${field('Observação / fornecedor','note','text',item?.note||'', 'maxlength="150"','full')}${field('id','id','hidden',item?.id||'','','collapse')}`;modal(item?'Editar compra':'Cadastrar compra de materiais',body,'Salvar compra','save-purchase','Compras de materiais entram como saída de caixa e saldo de estoque, não como despesa imediata no lucro.');}
function openSale(item){const available=calc(state).inv,unit=unitCost();const b=`${field('Cliente / estabelecimento','client','text',item?.client||'','maxlength="90" required','full')}${sel('Modelo de plaquinha','model',MODELS.filter(x=>x!=='Não informado'||item?.model==='Não informado').map(x=>[x,x]),item?.model||'Google')}${sel('Etapa do pedido','stage',STAGES,item?.stage||'novo')}${field('Data da venda','date','date',item?.date||today(),'required')}${field('Quantidade de plaquinhas','qty','number',item?.qty||1,'min="1" step="1" required')}${field('Preço por plaquinha (R$)','unitPrice','number',item?.unitPrice??state.settings.salePrice,'min="0.01" step="0.01" required')}${field('Desconto total do pedido (R$)','discount','number',item?.discount??0,'min="0" step="0.01" required')}${field('Custos extras do pedido (R$)','extraCost','number',item?.extraCost??0,'min="0" step="0.01" required')}${field('Vencimento do pagamento (opcional)','dueDate','date',item?.dueDate||'')}${!item?field('Valor recebido agora (R$)','initialPaid','number',0,'min="0" step="0.01" required'):''}${field('Observações','note','text',item?.note||'','maxlength="200"','full')}${field('id','id','hidden',item?.id||'','','collapse')}`;modal(item?'Editar venda':'Registrar venda de plaquinha',b,'Salvar venda','save-sale',`Custo médio atual dos materiais: <b>${unit===null?'Aguardando compras registradas':money(unit)}</b> por unidade. Estoque: ${MATERIALS.filter(m=>recipeOf(state)[m.id]>0).map(m=>m.name+': '+num(available[m.id].qty)).join(' · ')}. O material fica comprometido na venda, independentemente da etapa operacional.`)}

function openMovement(item){const b=`${sel('Tipo de movimentação','type',[['aporte','Aporte — coloquei dinheiro'],['retirada','Retirada — tirei dinheiro']],item?.type||'aporte')}${field('Data','date','date',item?.date||today(),'required')}${field('Valor (R$)','amount','number',item?.amount??'','min="0.01" step="0.01" required')}${field('Motivo / observação','note','text',item?.note||'','maxlength="150"','full')}${field('id','id','hidden',item?.id||'','','collapse')}`;modal(item?'Editar movimentação':'Capital da NEXO',b,'Salvar movimentação','save-movement','Aporte e retirada alteram o caixa estimado, mas não são vendas, faturamento ou despesas e não alteram o lucro.');}
function openExpense(item){const b=`${field('Descrição da despesa','description','text',item?.description||'','maxlength="150" required','full')}${sel('Categoria','category',CATS.map(x=>[x,x]),item?.category||CATS[0])}${field('Data de pagamento','date','date',item?.date||today(),'required')}${field('Valor pago (R$)','amount','number',item?.amount??'','min="0.01" step="0.01" required')}${field('id','id','hidden',item?.id||'','','collapse')}`;modal(item?'Editar despesa':'Registrar despesa',b,'Salvar despesa','save-expense','Use esta área apenas para custos operacionais. Acrílicos, adesivos, tags NFC e embalagens devem ser registrados em Estoque.');}
function openPayment(sale){const due=round(saleTotal(sale)-paymentSum(sale.id));if(due<=0)return notify('Esta venda já está quitada.');const b=`<div class="field full"><label>Cliente / valor em aberto</label><div class="helper-card">${esc(sale.client)} · ${money(due)} pendente</div></div>${field('Valor recebido (R$)','amount','number',due,`min="0.01" max="${due.toFixed(2)}" step="0.01" required`)}${field('Data do recebimento','date','date',today(),'required')}${field('Observação (opcional)','note','text','','maxlength="150"','full')}${field('id','saleId','hidden',sale.id,'','collapse')}`;modal('Registrar recebimento',b,'Confirmar pagamento','save-payment','O pagamento entra no caixa na data informada. O faturamento já foi reconhecido na data original da venda.');}
function openSaleDetail(id){const sale=state.sales.find(x=>x.id===id);if(!sale)return;const x=detailSales().find(x=>x.id===id);const receipts=state.payments.filter(x=>x.saleId===id).sort((a,b)=>b.date.localeCompare(a.date));const b=`<div class="panel-pad"><div class="kpi-row"><div class="tag"><label>Venda total</label><strong>${money(x.revenue)}</strong></div><div class="tag"><label>Recebido</label><strong>${money(x.received)}</strong></div><div class="tag"><label>Falta receber</label><strong>${money(x.pending)}</strong></div><div class="tag"><label>Lucro do pedido</label><strong>${money(x.profit)}</strong></div></div><div class="mini-list" style="margin-top:14px"><div class="mini-item"><span>Cliente</span><b>${esc(x.client)}</b></div><div class="mini-item"><span>Modelo</span><b>${esc(x.model)}</b></div><div class="mini-item"><span>Etapa do pedido</span><b>${esc(stageLabel(x.stage))}</b></div><div class="mini-item"><span>Venda</span><b>${fmtDate(x.date)} · ${x.qty} un.</b></div><div class="mini-item"><span>Preço unitário</span><b>${money(x.unitPrice)}</b></div><div class="mini-item"><span>Desconto</span><b>${money(x.discount)}</b></div><div class="mini-item"><span>Custos dos materiais</span><b>${money(x.materialsCost)}</b></div><div class="mini-item"><span>Custos extras</span><b>${money(x.extraCost)}</b></div><div class="mini-item"><span>Vencimento</span><b>${fmtDate(x.dueDate)}</b></div>${x.note?`<div class="mini-item"><span>Observação</span><b>${esc(x.note)}</b></div>`:''}</div><h4>Histórico de pagamentos</h4>${receipts.length?`<div class="mini-list">${receipts.map(p=>`<div class="mini-item"><span>${fmtDate(p.date)}${p.note?' · '+esc(p.note):''}</span><span><b class="text-green">${money(p.amount)}</b> <button class="link" data-action="payment-delete" data-id="${esc(p.id)}" aria-label="Excluir recebimento">Excluir</button></span></div>`).join('')}</div>`:'<p class="smallmuted">Nenhum pagamento registrado.</p>'}<div class="row-flex" style="margin-top:19px">${x.pending>.009?`<button class="btn primary" data-action="payment" data-id="${esc(id)}">${ico('plus')}Receber pagamento</button>`:''}${x.stage!=='entregue'?`<button class="btn" data-action="stage-next" data-id="${esc(id)}">${ico('check')}Avançar etapa</button>`:''}<button class="btn" data-action="sale-edit" data-id="${esc(id)}">${ico('edit')}Editar venda</button>${!receipts.length?`<button class="btn danger" data-action="sale-cancel" data-id="${esc(id)}">Cancelar venda</button>`:''}</div>${receipts.length?'<p class="note">Para cancelar uma venda quitada, primeiro remova os registros de recebimento somente se os valores tiverem sido devolvidos; os recebimentos apagados deixam de compor o caixa.</p>':''}</div>`;document.getElementById('modalMount').innerHTML=`<div class="modal-backdrop" data-backdrop="true"><div role="dialog" aria-modal="true" class="modal"><div class="modal-head"><h3>${esc(x.client)}</h3><button type="button" class="icon-btn" data-action="close" aria-label="Fechar">${ico('close')}</button></div>${b}</div></div>`;}
function toObject(form){return Object.fromEntries(new FormData(form).entries())}
function submitForm(form){const v=toObject(form),kind=form.dataset.submit;let next=clone();try{
if(kind==='save-purchase'){const old=next.purchases.find(x=>x.id===v.id);const item={id:old?.id||uid(),createdAt:old?.createdAt||new Date().toISOString(),date:v.date,material:v.material,qty:Number(v.qty),unitCost:round(v.unitCost),note:v.note.trim()};if(old)Object.assign(old,item);else next.purchases.push(item);}
else if(kind==='save-sale'){const old=next.sales.find(x=>x.id===v.id);const item={id:old?.id||uid(),createdAt:old?.createdAt||new Date().toISOString(),date:v.date,client:v.client.trim(),model:v.model,stage:v.stage,qty:Number(v.qty),unitPrice:round(v.unitPrice),discount:round(v.discount),extraCost:round(v.extraCost),dueDate:v.dueDate||'',note:v.note.trim(),recipeSnapshot:old?.recipeSnapshot||{...recipeOf(state)},cancelled:false};if(!item.client)throw Error('Informe o cliente ou estabelecimento.');if(old)Object.assign(old,item);else next.sales.push(item);if(!old){const paid=round(Number(v.initialPaid));if(!Number.isFinite(paid)||paid<0||paid>saleTotal(item)+.001)throw Error('O valor recebido não pode exceder o total do pedido.');if(paid>0)next.payments.push({id:uid(),createdAt:new Date().toISOString(),saleId:item.id,date:item.date,amount:paid,note:'Pagamento inicial'});}}
else if(kind==='save-movement'){const old=next.movements.find(x=>x.id===v.id);const item={id:old?.id||uid(),createdAt:old?.createdAt||new Date().toISOString(),type:v.type,date:v.date,amount:round(v.amount),note:v.note.trim()};if(old)Object.assign(old,item);else next.movements.push(item);}
else if(kind==='save-expense'){const old=next.expenses.find(x=>x.id===v.id);const item={id:old?.id||uid(),createdAt:old?.createdAt||new Date().toISOString(),description:v.description.trim(),category:v.category,date:v.date,amount:round(v.amount)};if(!item.description)throw Error('Informe a descrição da despesa.');if(old)Object.assign(old,item);else next.expenses.push(item);}
else if(kind==='save-payment'){next.payments.push({id:uid(),createdAt:new Date().toISOString(),saleId:v.saleId,date:v.date,amount:round(v.amount),note:v.note.trim()});}
validateData(next);if(!persist(next))return;closeModal();render();notify('Registro salvo com sucesso.');}
catch(e){errForm(e.message||'Verifique os dados informados.');}}
function updateSettings(form){const d=toObject(form),next=clone(),r={};for(const m of MATERIALS)r[m.id]=Number(d[m.id]);next.settings.recipe=r;next.settings.salePrice=round(d.salePrice);next.settings.lowStock=Number(d.lowStock);next.settings.targetStock=Number(d.targetStock);if(!Number.isFinite(next.settings.salePrice)||next.settings.salePrice<=0||!Number.isInteger(next.settings.lowStock)||next.settings.lowStock<0||!Number.isInteger(next.settings.targetStock)||next.settings.targetStock<1||next.settings.targetStock>10000)return notify('Preencha preço e limite de estoque válidos.',true);try{validateData(next);if(persist(next)){render();notify('Parâmetros atualizados.')}}catch(e){notify(e.message,true)}}
function removeRecord(type,id){const next=clone();let msg='Excluir este registro?';if(type==='purchase'){msg='Excluir esta compra de material? Se houver vendas que dependam desse estoque, o sistema impedirá a exclusão.';next.purchases=next.purchases.filter(x=>x.id!==id)}if(type==='movement'){msg='Excluir esta movimentação de capital? O saldo estimado de caixa será recalculado.';next.movements=next.movements.filter(x=>x.id!==id)}if(type==='expense'){msg='Excluir esta despesa?';next.expenses=next.expenses.filter(x=>x.id!==id)}if(type==='payment'){msg='Excluir este recebimento? Faça isso apenas para corrigir um lançamento incorreto: o valor sairá do histórico de caixa.';next.payments=next.payments.filter(x=>x.id!==id)}if(type==='sale'){const x=next.sales.find(v=>v.id===id);if(!x)return;if(paymentSum(id)>0)return notify('Esta venda tem recebimentos. A reversão financeira deve ser tratada antes do cancelamento.',true);msg='Cancelar esta venda? O estoque será devolvido. O pedido ficará fora dos relatórios.';x.cancelled=true;}if(!window.confirm(msg))return;try{validateData(next);if(persist(next)){closeModal();render();notify('Alteração realizada.')}}catch(e){notify(e.message,true)}}
function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function backup(){download(JSON.stringify({...state,backupDate:new Date().toISOString()},null,2),`NEXO-backup-${today()}.json`,'application/json;charset=utf-8');notify('Backup JSON exportado. Guarde o arquivo em local seguro.')}
function csvEscape(v){const str=String(v??'');const safe=/^[\s]*[=+@\-\t\r]/.test(str)?"'"+str:str;return '"'+safe.replaceAll('"','""')+'"'}
function csvOut(){const rows=[['Tipo','Data','Descrição ou cliente','Categoria / material','Quantidade','Preço unitário','Valor total','Pago / recebido','Custo material','Custo extra','Situação','Etapa / modelo']];
 for(const p of state.purchases)rows.push(['Compra',p.date,p.note||'Compra material',p.material,p.qty,p.unitCost,round(p.qty*p.unitCost),'','','','Pago','']);
 for(const x of detailSales()){const [st]=status(x);rows.push(['Venda',x.date,x.client,'Plaquinha NFC',x.qty,x.unitPrice,x.revenue,x.received,x.materialsCost,x.extraCost,st,`${x.model} / ${stageLabel(x.stage)}`]);}
 for(const p of state.payments)rows.push(['Recebimento',p.date,state.sales.find(x=>x.id===p.saleId)?.client||'Venda','','','',p.amount,p.amount,'','','Recebido','']);
 for(const e of state.expenses)rows.push(['Despesa',e.date,e.description,e.category,'','',e.amount,'','','','Pago','']);
 for(const m of state.movements)rows.push([m.type==='aporte'?'Aporte':'Retirada',m.date,m.note||'Movimentação do proprietário','Capital','','',m.amount,'','','',m.type,'']);
 const csv='\ufeff'+rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');download(csv,`NEXO-relatorio-${today()}.csv`,'text/csv;charset=utf-8');notify('Relatório CSV exportado.');
}

async function importJSON(file){if(!file)return;try{if(file.size>5e6)throw Error('Arquivo muito grande. Limite: 5 MB.');const raw=await file.text();const obj=upgradeData(JSON.parse(raw));validateData(obj);if(!window.confirm('Importar backup e SUBSTITUIR todos os registros deste navegador? Faça um backup do estado atual antes de continuar.'))return;{delete window.__nexoLoadProblem;if(persist(obj)){filter='all';closeModal();render();notify('Backup importado com sucesso.')}}}catch(e){notify('Importação não realizada: '+(e.message||'arquivo inválido'),true)}}
function reset(){const answer=window.prompt('ATENÇÃO: isso apaga todo o histórico local. Exporte um backup antes. Para confirmar, digite ZERAR:');if(answer!=='ZERAR')return;const next=fresh();delete window.__nexoLoadProblem;if(persist(next)){filter='all';choosePage('dashboard');notify('Os registros locais foram zerados.')}}
function handleAction(action,id){if(action==='more'){document.getElementById('mobileMore')?.classList.toggle('open');return}if(action==='close'){closeModal();return}if(action==='sale'){openSale();return}if(action==='purchase'){openPurchase();return}if(action==='expense'){openExpense();return}if(action==='movement'){openMovement();return}if(action==='backup'){backup();return}if(action==='csv'){csvOut();return}if(action==='reset'){reset();return}if(action==='sale-detail'){openSaleDetail(id);return}if(action==='payment'){const sale=state.sales.find(x=>x.id===id&&!x.cancelled);if(sale)openPayment(sale);return}if(action==='sale-edit'){const sale=state.sales.find(x=>x.id===id);if(sale)openSale(sale);return}if(action==='purchase-edit'){const p=state.purchases.find(x=>x.id===id);if(p)openPurchase(p);return}if(action==='expense-edit'){const e=state.expenses.find(x=>x.id===id);if(e)openExpense(e);return}if(action==='movement-edit'){const x=state.movements.find(x=>x.id===id);if(x)openMovement(x);return}if(action==='stage-next'){const n=clone(),x=n.sales.find(x=>x.id===id&&!x.cancelled);if(!x)return;const index=STAGES.findIndex(t=>t[0]===x.stage);if(index<0||index>=STAGES.length-1)return; x.stage=STAGES[index+1][0];try{validateData(n);if(persist(n)){closeModal();render();notify('Pedido atualizado: '+stageLabel(x.stage)+'.')}}catch(e){notify(e.message,true)}return}if(action==='purchase-delete')removeRecord('purchase',id);if(action==='expense-delete')removeRecord('expense',id);if(action==='movement-delete')removeRecord('movement',id);if(action==='payment-delete')removeRecord('payment',id);if(action==='sale-cancel')removeRecord('sale',id)}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){choosePage(b.dataset.page);return}const a=e.target.closest('[data-action]');if(a){if(a.tagName==='BUTTON')e.preventDefault();handleAction(a.dataset.action,a.dataset.id);return}if(e.target.matches('[data-backdrop]'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.matches('#editForm')){e.preventDefault();submitForm(e.target)}else if(e.target.matches('#settingsForm')){e.preventDefault();updateSettings(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='periodFilter'){filter=e.target.value;render()}if(e.target.id==='importFile'){importJSON(e.target.files?.[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(['simPrice','simQty','simExtra'].includes(e.target.id))simulate()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
state=load();navBuild();choosePage('dashboard');
})();
</script>
</body></html>
